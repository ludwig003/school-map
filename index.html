<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Քարտեզ — կետերի կառավարում</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;background:#f5f6f8}
header{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 18px;font-weight:700}
.main{display:flex;flex:1;min-height:0}.panel{width:350px;background:#fff;padding:16px;overflow:auto;border-right:1px solid #ddd}
#map{flex:1;min-width:0;min-height:0}
h2{font-size:17px;margin:0 0 14px}.muted{font-size:12px;color:#666;line-height:1.5}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;font-size:14px}
textarea{min-height:65px;resize:vertical}.row{display:flex;gap:8px}.row>div{flex:1}
button{border:0;border-radius:7px;padding:10px 12px;cursor:pointer;font-weight:600}
.primary{width:100%;background:#1f2937;color:white;margin-top:12px}.secondary{background:#eef0f3}.danger{background:#fee2e2;color:#991b1b}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.toolbar button{width:100%}
.item{border:1px solid #ddd;border-radius:9px;padding:10px;margin-top:9px}.item b{display:block;margin-bottom:3px}
.coords{font-size:11px;color:#666}.desc{font-size:12px;margin-top:5px;white-space:pre-wrap}
.item .buttons{display:flex;gap:6px;margin-top:8px}.item .buttons button{flex:1;padding:7px;font-size:12px}
#status{margin-top:10px;font-size:12px;color:#555}.count{margin-top:16px;font-weight:700}
@media(max-width:800px){.main{flex-direction:column}.panel{width:100%;height:43%;border-right:0;border-bottom:1px solid #ddd}#map{height:57%}}
</style>
</head>
<body>
<header>🗺️ Ինտերակտիվ քարտեզ</header>
<div class="main">
<aside class="panel">
<h2>Տեղեր ավելացնել</h2>
<div class="muted">Կարող ես կամ մուտքագրել կոորդինատները, կամ քարտեզի վրա պարզապես սեղմել։ Սեղմելուց կոորդինատները ավտոմատ կլրացվեն։</div>

<label>Լայնություն (Latitude)</label>
<input id="lat" type="number" step="any" placeholder="40.1792">
<label>Երկայնություն (Longitude)</label>
<input id="lng" type="number" step="any" placeholder="44.4991">
<label>Անվանում</label>
<input id="name" placeholder="Վայրի անվանումը">
<label>Նկարագրություն</label>
<textarea id="desc" placeholder="Լրացուցիչ տեղեկություն"></textarea>
<button class="primary" onclick="addFromForm()">📍 Ավելացնել կետ</button>

<div class="toolbar">
<button class="secondary" onclick="save()">💾 Պահպանել</button>
<button class="secondary" onclick="load()">↻ Բեռնել</button>
<button class="secondary" onclick="exportJSON()">⬇ JSON</button>
<button class="secondary" onclick="fitAll()">🔎 Բոլորը</button>
</div>
<button class="danger" style="width:100%;margin-top:8px" onclick="clearAll()">Ջնջել բոլոր կետերը</button>

<div id="status"></div>
<div class="count">Նշված վայրեր</div>
<div id="list"></div>
</aside>
<div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{preferCanvas:true}).setView([40.1792,44.4991],12);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© OpenStreetMap contributors'
}).addTo(map);
const initialPoints=[{"lat": 40.186402, "lng": 44.520721, "name": "Школа №8 имени А.Пушкина", "desc": "+(374 10)56-49-31 | Карине Мхитарян"}, {"lat": 40.191207, "lng": 44.511881, "name": "Школа №55 имени Антона Чехова", "desc": "+(374 10)52 64 22, 56 06 00 |\nГаяне Саруханян"}, {"lat": 40.20031, "lng": 44.498084, "name": "Школа №56 имени Степана Зоряна", "desc": "+(374 10) 27-20-70 | Сусанна Галстян"}, {"lat": 40.201625, "lng": 44.492408, "name": "Школа №130 имени Наири Заряна", "desc": "+(374 10)22 23 00 | Нелли Казарян"}, {"lat": 40.207394, "lng": 44.503636, "name": "Школа №132 имени Ованнеса Исакова", "desc": "+(374 10) 32-11-44 | И/о Левон Даниелян"}, {"lat": 40.210429, "lng": 44.506157, "name": "Школа «Усмунк» (Армянско-российский (Славонийский) университет)", "desc": "+374-10-201611 | Наира Дашян"}, {"lat": 40.21938, "lng": 44.487864, "name": "Школа №200 имени Леонида Азгалдяна ", "desc": "+(374 10) 36-90-93 | Марине Ованисян"}, {"lat": 40.224594, "lng": 44.493701, "name": "Школа N192 имени Геворга Варданяна", "desc": "+(374 10) 36-98-80 | Рипсиме Квшецян"}, {"lat": 40.22296, "lng": 44.49854, "name": "Школа №196 имени Ашота Навасардяна", "desc": "+(374 10) 36-19-08 | Ануш Навасардян"}, {"lat": 40.222149, "lng": 44.498674, "name": "Школа №199 имени Генриха Хачатряна", "desc": "+(374 10) 36-92-41 | И/о Сусанна Мовсисян"}, {"lat": 40.216005, "lng": 44.476572, "name": "Школа №93 имени А. Манукяна", "desc": "+(374 10) 36-31-83 | Ирина Акопян"}, {"lat": 40.207508, "lng": 44.465087, "name": "Школа №168 имени Вазгена Первого", "desc": "+(374 10) 35-04-01 | Гоар Мелик-Степанян"}, {"lat": 40.205472, "lng": 44.466777, "name": "Школа №155 имени Л. Мириджаняна", "desc": "+(374 10) 34-09-66 | Наира Манвелян"}, {"lat": 40.211519, "lng": 44.460522, "name": "Школа №22", "desc": "+(374 10) 39-11-13 | Маргарит Оганисян"}, {"lat": 40.196569, "lng": 44.47095, "name": "Школа №153 имени Рафаела Ишханяна", "desc": "+(374 10) 34-90-37 | Ануш Саргсян"}, {"lat": 40.193446, "lng": 44.471138, "name": "Школа №131 имени Пейо Яворова", "desc": "+(374 10) 39-13-70 | Наира Закарян"}, {"lat": 40.185861, "lng": 44.461659, "name": "Школа №89 имени Даниела Варужана", "desc": "+(374 10) 74-14-61 | Ануш Асланян"}, {"lat": 40.184988, "lng": 44.454154, "name": "Школа №121 имени Эд. Бояджяна", "desc": "+(374 10) 74-15-81 | Гоар Закарян"}, {"lat": 40.182972, "lng": 44.446977, "name": "Школа №162 имени Сиаманто", "desc": "+(374 10) 72-82-10 | Лилия Погосян"}, {"lat": 40.209344, "lng": 44.515234, "name": "Школа №82 имени Ованнеса Погосяна", "desc": "(374 10) 23-34-81 | И/о Гоар Минасян"}, {"lat": 40.207553, "lng": 44.508823, "name": "Школа №36 имени Раффи", "desc": "+(374 10) 23-48-56 | Нуне Казарян"}, {"lat": 40.20278, "lng": 44.504875, "name": "Школа №129 имени Гая (Айк Бжшкянц)", "desc": "+(374 10) 22-34-82, 22-31-96 | Ануш Мартиросян"}, {"lat": 40.20092, "lng": 44.511173, "name": "Школа №151 имени Рубена Севака", "desc": "+(374 10) 25-57-88 | И/о Анаит Галстян"}, {"lat": 40.202022, "lng": 44.527287, "name": "Школа №59 имени Акопа Пароняна", "desc": "+(37410) 25-70-10 | Мелконян Термине"}, {"lat": 40.201498, "lng": 44.538676, "name": "Школа №48 имени Мисака Манушяна", "desc": "+(374 10) 24-01-70 | Жасмена Аристакесян"}, {"lat": 40.173143, "lng": 44.505191, "name": "Школа №7 имени Владимира Маяковского", "desc": "+(374 10) 52 79 29, 52 46 21, | Виктория Рухкян"}, {"lat": 40.165273, "lng": 44.504569, "name": "Школа №13 имени Эрнста Тельмана", "desc": "+(374 10) 52-56-63 | И/о Сусанна Айрапетян"}, {"lat": 40.167601, "lng": 44.512321, "name": "Школа №53 имени Агаси Ханджян", "desc": "+(374 10) 56-27-64, 58-24-14 | Лилит Мовсисян"}, {"lat": 40.16509, "lng": 44.518329, "name": "Школа №33 имени Микаела Налбандяна", "desc": "+(374 10)55-15-22 | Ануш Амбарцумян"}, {"lat": 40.161887, "lng": 44.510486, "name": "Школа №34 имени Степана Лисицяна", "desc": "+(374 10) 55-01-70 | Наира Манукян"}, {"lat": 40.16112, "lng": 44.512138, "name": "Школа №60 имени Ваана Терьяна", "desc": "+(374 10)55 00 70 | Сона Даниелян"}, {"lat": 40.15481, "lng": 44.511226, "name": "Школа №6 имени Акопа Карапенца", "desc": "+(374 10) 45-38-00 | Сирануш Варданян"}, {"lat": 40.15224, "lng": 44.500701, "name": "Школа №32 имени Ованнеса Туманяна", "desc": "+(374 10)44-02-60 | Кнарик Петросян"}, {"lat": 40.151538, "lng": 44.492403, "name": "Школа №38 имени Виссариона Белинского", "desc": "+(374 10) 44-00-66 | Лейли Матинян"}, {"lat": 40.147245, "lng": 44.483154, "name": "Школа №69 имени А. Сахарова", "desc": "+(374 10) 46-20-31 | Марианна Мелян"}, {"lat": 40.147442, "lng": 44.487918, "name": "Школа №18 имени Мурацана", "desc": "(374 10) 48-39-71 | Лилит Арзуманян"}, {"lat": 40.147112, "lng": 44.486837, "name": "Школа №161 имени Гарегина Нжде", "desc": "+(374 10) 48-76-70 | Лилит Мкртчян"}, {"lat": 40.144453, "lng": 44.484345, "name": "Школа №110", "desc": "+(374 10) 48-21-62 | Ася Бадалян"}, {"lat": 40.174939, "lng": 44.527124, "name": "Школа №10 имени Хримяна Айрика", "desc": "+(374 10) 55-23-25 | Наира Симонян"}, {"lat": 40.180046, "lng": 44.540087, "name": "Школа №61 имени Геворга Атарбекяна", "desc": "+(374 10) 65-36-21 | Лусине Григорян"}, {"lat": 40.154384, "lng": 44.522374, "name": "Школа №17 имени Врежа Амбарцумяна", "desc": "+(374 10) 45-09-52 | Алла Казарян"}, {"lat": 40.146105, "lng": 44.522411, "name": "Школа №194 имени А. Ованнисяна", "desc": "+(374 10) 45-39-20,45-90-3 | Нуне Манукян"}, {"lat": 40.154146, "lng": 44.480156, "name": "Школа №66  им. А. Мясникяна", "desc": "+(374 10) 42-08-33 | Наира Акопян"}, {"lat": 40.157073, "lng": 44.482323, "name": "Школа №50", "desc": "+(374 10)44-33-02, 44-29-20 | Сюзанна Арутюнова"}, {"lat": 40.155466, "lng": 44.488074, "name": "Школа №48 имени Мисака Манушяна", "desc": "+(374 10) 24-01-70 | Жасмена Аристакесян"}, {"lat": 40.151547, "lng": 44.489281, "name": "Школа №12 имени Виктора Амбарцумяна", "desc": "+(374 10) 44-06-01 | Тереза Оганесян"}, {"lat": 40.145224, "lng": 44.491421, "name": "Школа №86 имени Мартироса Сарьяна", "desc": "+(374 10) 48-39-60 | Дианна Айрапетян"}, {"lat": 40.195569, "lng": 44.488862, "name": "Школа №63 имени Газароса Агаяна", "desc": "+(374 10) 22-03-69 | Лусине Пирумян"}, {"lat": 40.185711, "lng": 44.518133, "name": "Школа №19 имени Никола Агбаляна", "desc": "+(374 10) 58-73-50 | И/о Рузанна Седракян"}, {"lat": 40.141111, "lng": 44.516462, "name": "Школа №68 имени Мушега Мхояна", "desc": "+(374 10) 45-29-80 | Мовсисян Нелсик"}, {"lat": 40.167921, "lng": 44.518855, "name": "Школа №14 имени Нар-Доса", "desc": "+(374 10)55-07-44, 55-07-70 | И/о Мелсида Рубенян"}, {"lat": 40.172987, "lng": 44.459374, "name": "Школа №90 имени Ваана Затикяна", "desc": "+(374 10) 77-25-36 | Сирамарг Хоцанян"}, {"lat": 40.169417, "lng": 44.44091, "name": "Ереванская школа №181", "desc": "+(374 10) 72-98-24, 73-57-51 | Лилит Ареян"}];
let points=initialPoints,markers=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function msg(t){document.getElementById('status').textContent=t}

function addPoint(lat,lng,name,desc,center=true){
 lat=Number(lat);lng=Number(lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat<-90||lat>90||lng<-180||lng>180){msg('❌ Սխալ կոորդինատներ');return false}
 const p={lat,lng,name:name||'Անանուն վայր',desc:desc||''};
 points.push(p);
 redraw();
 if(center) map.setView([lat,lng],16);
 msg('✓ Կետը ավելացվեց');
 return true;
}
function addFromForm(){
 if(addPoint(document.getElementById('lat').value,document.getElementById('lng').value,
 document.getElementById('name').value,document.getElementById('desc').value)){
 ['lat','lng','name','desc'].forEach(id=>document.getElementById(id).value='');
 }
}
function redraw(){
 markers.forEach(m=>map.removeLayer(m));markers=[];
 const list=document.getElementById('list');list.innerHTML='';
 points.forEach((p,i)=>{
  const m=L.marker([p.lat,p.lng]).addTo(map).bindPopup(
   '<b>'+esc(p.name)+'</b><br>'+esc(p.desc)+'<br><small>'+p.lat.toFixed(6)+', '+p.lng.toFixed(6)+'</small>');
  markers.push(m);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<b>'+esc(p.name)+'</b><div class="coords">'+p.lat.toFixed(6)+', '+p.lng.toFixed(6)+'</div>'+
  (p.desc?'<div class="desc">'+esc(p.desc)+'</div>':'')+
  '<div class="buttons"><button class="secondary" onclick="focusPoint('+i+')">Տեսնել</button>'+
  '<button class="danger" onclick="removePoint('+i+')">Ջնջել</button></div>';
  list.appendChild(d);
 });
}
function focusPoint(i){map.setView([points[i].lat,points[i].lng],17);markers[i].openPopup()}
function removePoint(i){points.splice(i,1);redraw();save(false);msg('Կետը ջնջվեց')}
function clearAll(){if(!confirm('Ջնջե՞լ բոլոր կետերը'))return;points=[];redraw();localStorage.removeItem('mapPoints');msg('Բոլոր կետերը ջնջվեցին')}
function save(show=true){localStorage.setItem('mapPoints',JSON.stringify(points));if(show)msg('✓ Պահպանվեց այս բրաուզերում')}
function load(){
 try{const saved=localStorage.getItem('mapPoints');points=saved?JSON.parse(saved):initialPoints.map(p=>({...p}));redraw();fitAll();msg('✓ Կետերը բեռնվեցին')}
 catch(e){msg('❌ Պահպանված տվյալները վնասված են')}
}
function fitAll(){
 if(!points.length)return;
 map.fitBounds(L.latLngBounds(points.map(p=>[p.lat,p.lng])),{padding:[30,30]});
}
function exportJSON(){
 const blob=new Blob([JSON.stringify(points,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='map-points.json';a.click();
 URL.revokeObjectURL(a.href);
}
map.on('click',e=>{
 document.getElementById('lat').value=e.latlng.lat.toFixed(6);
 document.getElementById('lng').value=e.latlng.lng.toFixed(6);
 document.getElementById('name').focus();
 msg('Կոորդինատները լրացվեցին․ գրիր անունը և ավելացրու կետը');
});
redraw();
fitAll();
</script>
</body>
</html>
